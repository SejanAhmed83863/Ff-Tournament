<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Tournaments - Jahanabad TC</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--amber:#b8860b;--amber-deep:#6b4f00;--gold:#fecb00;--dark:#000;--card:rgba(20,20,20,0.97);--border:#333;--text:#fff;--muted:#999;--green:#5CFF8A;--danger:#FF6B6B}
    body{
      font-family:'Oswald',sans-serif;background:#0a0a0a;color:var(--text);min-height:100vh;padding-bottom:90px;
      background-image:linear-gradient(to bottom,rgba(0,0,0,0.9),rgba(0,0,0,0.97));
      background-size:cover;background-position:center;background-attachment:fixed;
    }
    .header{background:linear-gradient(180deg,rgba(0,0,0,0.97),rgba(10,10,10,0.9));border-bottom:2px solid var(--gold);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .logo-wrap{display:flex;align-items:center;gap:10px}
    .logo-img{width:40px;height:40px;border-radius:6px;border:2px solid var(--gold);object-fit:cover}
    .header-title{font-family:'Teko',sans-serif;font-size:24px;color:var(--gold);text-transform:uppercase;letter-spacing:2px}
    .wallet-badge{background:linear-gradient(180deg,var(--amber),var(--amber-deep));border:1px solid var(--gold);padding:6px 14px;border-radius:6px;font-family:'Teko';font-size:18px;color:var(--gold);letter-spacing:1px}

    .content{padding:14px;max-width:500px;margin:0 auto}
    .section-title{font-family:'Teko',sans-serif;font-size:22px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;border-left:4px solid var(--gold);padding-left:10px}

    /* TOURNAMENT CARD */
    .t-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
    .t-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--gold),var(--amber))}
    .t-banner{height:140px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:15px}
    .t-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.9),transparent)}
    .t-title{position:relative;z-index:1;font-family:'Teko';font-size:28px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;line-height:1}
    
    .t-info-grid{display:grid;grid-template-columns:repeat(3,1fr);padding:12px;gap:8px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border)}
    .info-item{text-align:center}
    .info-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
    .info-value{font-family:'Teko';font-size:18px;color:#fff}
    
    .t-body{padding:15px}
    .t-meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
    .t-time{font-size:13px;color:var(--gold);font-weight:600}
    .t-joined{font-size:12px;color:var(--muted)}
    
    .progress-bar{height:6px;background:#222;border-radius:10px;margin-bottom:15px;overflow:hidden;border:1px solid #333}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--gold));transition:0.5s ease}
    
    .btn-row{display:flex;gap:10px}
    .btn-info{flex:1;padding:10px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Teko';font-size:18px;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
    .btn-join{flex:2;padding:10px;background:linear-gradient(180deg,var(--amber),var(--amber-deep));border:1px solid var(--gold);color:var(--gold);font-family:'Teko';font-size:18px;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:2px}
    .btn-join:disabled{background:#222;border-color:#444;color:#666;cursor:not-allowed}

    /* MODAL OVERLAY */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;align-items:flex-end;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:#111;border:1px solid var(--gold);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-width:500px;animation:slideUp 0.3s ease both;max-height:90vh;overflow-y:auto}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    
    .modal-title{font-family:'Teko';font-size:26px;color:var(--gold);text-transform:uppercase;margin-bottom:15px;border-bottom:1px solid var(--border);padding-bottom:10px}
    .info-content{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:20px}
    .info-content b{color:var(--gold)}
    .m-label{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;display:block}
    .m-input{width:100%;background:#000;border:1px solid var(--border);padding:12px;border-radius:8px;color:#fff;font-family:'Oswald';font-size:14px;outline:none}
    .m-input:focus{border-color:var(--gold)}
    
    .msg{padding:10px;border-radius:6px;font-size:13px;margin:10px 0;display:none;text-align:center;font-weight:600}
    .msg.error{display:block;background:rgba(255,0,0,0.1);color:var(--danger);border:1px solid var(--danger)}
    .msg.success{display:block;background:rgba(0,255,0,0.1);color:var(--green);border:1px solid var(--green)}

    .m-btn-group{display:flex;gap:10px;margin-top:20px}
    .m-btn-close{flex:1;padding:12px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;font-family:'Teko';font-size:20px;cursor:pointer}
    .m-btn-action{flex:2;padding:12px;background:linear-gradient(180deg,var(--amber),var(--amber-deep));border:1px solid var(--gold);color:var(--gold);border-radius:8px;font-family:'Teko';font-size:20px;cursor:pointer;text-transform:uppercase}

    /* FOOTER NAV */
    .footer-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,0.95);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:10px 0;z-index:100;backdrop-filter:blur(10px)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:1px}
    .nav-item i{font-size:20px}
    .nav-item.active{color:var(--gold)}
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-wrap">
      <img src="logo.png" alt="Logo" class="logo-img">
      <span class="header-title">TOURNAMENTS</span>
    </div>
    <div class="wallet-badge">৳ <span id="nav-balance">0</span></div>
  </header>

  <main class="content">
    <div class="section-title">Active Matches</div>
    <div id="tournaments-list">
      <div style="text-align:center;padding:40px;color:var(--muted)">Scanning for matches...</div>
    </div>
  </main>

  <nav class="footer-nav">
    <a href="home.html" class="nav-item"><i>🏠</i><span>HOME</span></a>
    <a href="tournaments.html" class="nav-item active"><i>🎮</i><span>PLAY</span></a>
    <a href="dashboard.html" class="nav-item"><i>👤</i><span>PROFILE</span></a>
  </nav>

  <div class="modal-overlay" id="info-modal">
    <div class="modal">
      <h2 class="modal-title" id="info-title">Match Rules</h2>
      <div class="info-content" id="info-text"></div>
      <div class="m-btn-group">
        <button class="m-btn-close" onclick="closeModal('info-modal')">CLOSE</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="join-modal">
    <div class="modal">
      <h2 class="modal-title" id="join-title">Register for Match</h2>
      <div id="join-msg" class="msg"></div>
      
      <label class="m-label">Your Full Name</label>
      <input type="text" id="join-name" class="m-input" placeholder="Enter your name">
      
      <label class="m-label">WhatsApp Number</label>
      <input type="text" id="join-whatsapp" class="m-input" placeholder="01XXXXXXXXX">

      <label class="m-label">Team Name (Optional)</label>
      <input type="text" id="join-team" class="m-input" placeholder="Enter team name">

      <label class="m-label">Game UIDs (One per line)</label>
      <textarea id="join-uids" class="m-input" style="height:80px; resize:none" placeholder="Enter Player UIDs"></textarea>

      <div class="m-btn-group">
        <button class="m-btn-close" onclick="closeModal('join-modal')">CANCEL</button>
        <button class="m-btn-action" onclick="confirmJoin()">JOIN NOW</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, where, addDoc, updateDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      // PASTE YOUR CONFIG HERE
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userData = null;
    let selectedT = null;

    onAuthStateChanged(auth, async (user) => {
      if(user){
        currentUser = user;
        const snap = await getDoc(doc(db, 'users', user.uid));
        if(snap.exists()){
          userData = snap.data();
          document.getElementById('nav-balance').textContent = userData.balance || 0;
          loadTournaments();
        }
      } else {
        window.location.href = 'index.html';
      }
    });

    async function loadTournaments() {
      const list = document.getElementById('tournaments-list');
      try {
        const q = query(collection(db, 'tournaments'), where('status', '==', 'open'));
        const snap = await getDocs(q);
        
        if(snap.empty){
          list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">No open matches right now.</div>';
          return;
        }

        let html = '';
        snap.forEach(d => {
          const t = { id: d.id, ...d.data() };
          const progress = (t.joined / t.totalSlots) * 100;
          const isFull = t.joined >= t.totalSlots;
          const date = t.time ? new Date(t.time).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : 'TBA';
          const type = t.teamType == 1 ? 'SOLO' : t.teamType == 2 ? 'DUO' : 'SQUAD';

          html += `
            <div class="t-card">
              <div class="t-banner" style="background-image:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=400')">
                <div class="t-title">${t.title}</div>
              </div>
              <div class="t-info-grid">
                <div class="info-item"><div class="info-label">Win Prize</div><div class="info-value">৳${t.prize}</div></div>
                <div class="info-item"><div class="info-label">Entry Fee</div><div class="info-value">${t.fee > 0 ? '৳'+t.fee : 'FREE'}</div></div>
                <div class="info-item"><div class="info-label">Mode</div><div class="info-value">${type}</div></div>
              </div>
              <div class="t-body">
                <div class="t-meta-row">
                  <div class="t-time">📅 ${date}</div>
                  <div class="t-joined">${t.joined}/${t.totalSlots} Joined</div>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                <div class="btn-row">
                  <button class="btn-info" onclick="viewInfo('${t.id}')">Info</button>
                  <button class="btn-join" ${isFull ? 'disabled' : ''} onclick="openJoinModal('${t.id}')">
                    ${isFull ? 'MATCH FULL' : 'JOIN MATCH'}
                  </button>
                </div>
              </div>
            </div>`;
        });
        list.innerHTML = html;
      } catch(e) {
        list.innerHTML = '<div class="msg error">Failed to load tournaments.</div>';
      }
    }

    window.viewInfo = async (id) => {
      const snap = await getDoc(doc(db, 'tournaments', id));
      if(!snap.exists()) return;
      const t = snap.data();
      document.getElementById('info-title').textContent = t.title + ' - Rules';
      document.getElementById('info-text').innerHTML = t.rules ? t.rules.replace(/\n/g, '<br>') : 'No specific rules provided for this match. Play fair!';
      document.getElementById('info-modal').classList.add('open');
    };

    window.openJoinModal = async (id) => {
      const snap = await getDoc(doc(db, 'tournaments', id));
      if(!snap.exists()) return;
      selectedT = { id: snap.id, ...snap.data() };
      
      document.getElementById('join-title').textContent = selectedT.title;
      document.getElementById('join-name').value = userData.name || '';
      document.getElementById('join-whatsapp').value = userData.whatsapp || '';
      document.getElementById('join-modal').classList.add('open');
    };

    window.closeModal = (id) => document.getElementById(id).classList.remove('open');

    window.confirmJoin = async () => {
      const name = document.getElementById('join-name').value.trim();
      const whatsapp = document.getElementById('join-whatsapp').value.trim();
      const teamName = document.getElementById('join-team').value.trim() || 'Solo';
      const uids = document.getElementById('join-uids').value.trim();
      const msg = document.getElementById('join-msg');

      if(!name || !whatsapp || !uids){
        showModalMsg('Please fill Name, WhatsApp and UID.', 'error');
        return;
      }

      if(userData.balance < selectedT.fee){
        showModalMsg('Insufficient balance. Please deposit first.', 'error');
        return;
      }

      try {
        if(selectedT.fee > 0){
          const newBal = userData.balance - selectedT.fee;
          await updateDoc(doc(db, 'users', currentUser.uid), { balance: newBal });
          await addDoc(collection(db, 'transactions'), {
            uid: currentUser.uid, email: currentUser.email,
            amount: selectedT.fee, type: 'entry', status: 'approved',
            reason: 'Joined: ' + selectedT.title, created_at: serverTimestamp()
          });
          userData.balance = newBal;
          document.getElementById('nav-balance').textContent = newBal;
        }

        await addDoc(collection(db, 'registrations'), {
          uid: currentUser.uid, tournament_id: selectedT.id, tournament_name: selectedT.title,
          name, whatsapp, team_name: teamName, game_uids: uids, entry_paid: selectedT.fee,
          created_at: serverTimestamp()
        });

        await updateDoc(doc(db, 'tournaments', selectedT.id), { joined: increment(1) });
        await updateDoc(doc(db, 'users', currentUser.uid), { played: increment(1), name, whatsapp });

        showModalMsg('Joined successfully! Check WhatsApp for Room Details.', 'success');
        setTimeout(() => { closeModal('join-modal'); loadTournaments(); }, 2000);
      } catch(e) {
        showModalMsg('Join failed. Try again.', 'error');
      }
    };

    function showModalMsg(text, type){
      const el = document.getElementById('join-msg');
      el.textContent = text;
      el.className = 'msg ' + type;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
