<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Profile - Jahanabad TC</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--amber:#b8860b;--amber-deep:#6b4f00;--gold:#fecb00;--dark:#000;--card:rgba(20,20,20,0.97);--border:#333;--text:#fff;--muted:#999;--green:#5CFF8A;--danger:#FF6B6B}
    body{
      font-family:'Oswald',sans-serif;background:#0a0a0a;color:var(--text);min-height:100vh;padding-bottom:90px;
      background-image:linear-gradient(to bottom,rgba(0,0,0,0.9),rgba(0,0,0,0.97));
      background-size:cover;background-position:center;background-attachment:fixed;
    }
    .header{background:linear-gradient(180deg,rgba(0,0,0,0.97),rgba(10,10,10,0.9));border-bottom:2px solid var(--gold);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .logo-wrap{display:flex;align-items:center;gap:10px}
    .logo-img{width:40px;height:40px;border-radius:6px;border:2px solid var(--gold);object-fit:cover}
    .header-title{font-family:'Teko',sans-serif;font-size:24px;color:var(--gold);text-transform:uppercase;letter-spacing:2px}
    .wallet-badge{background:linear-gradient(180deg,var(--amber),var(--amber-deep));border:1px solid var(--gold);padding:6px 14px;border-radius:6px;font-family:'Teko';font-size:18px;color:var(--gold);letter-spacing:1px}

    .content{padding:14px;max-width:500px;margin:0 auto}

    .profile-card{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:14px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,0.7);position:relative}
    .profile-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--gold),var(--amber))}

    .profile-banner{background:linear-gradient(135deg,rgba(184,134,11,0.18),rgba(254,203,0,0.08),rgba(0,0,0,0.5));padding:18px 16px 14px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:relative}
    .avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Teko';font-size:28px;color:#000;font-weight:700;border:3px solid var(--gold);box-shadow:0 0 15px rgba(254,203,0,0.3);flex-shrink:0}
    .profile-info{flex:1;min-width:0}
    .game-name{font-family:'Teko',sans-serif;font-size:28px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;line-height:1;margin-bottom:3px;word-break:break-word}
    .player-name{color:#fff;font-size:14px;font-weight:600;margin-bottom:2px}
    .player-email{color:var(--muted);font-size:12px;letter-spacing:1px;margin-bottom:4px;word-break:break-all}
    .player-whatsapp{color:#25D366;font-size:12px;font-weight:600;margin-top:2px}
    .uid-tag{display:inline-block;background:rgba(184,134,11,0.15);border:1px solid var(--amber);color:var(--gold);font-family:'Teko';font-size:13px;padding:2px 10px;border-radius:4px;letter-spacing:1px;margin-top:4px}
    .edit-icon{position:absolute;top:12px;right:12px;background:rgba(254,203,0,0.1);border:1px solid var(--gold);color:var(--gold);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:0.2s}
    .edit-icon:hover{background:rgba(254,203,0,0.25)}

    .edit-panel{display:none;padding:16px;background:rgba(0,0,0,0.5);border-top:1px solid var(--border)}
    .edit-panel.open{display:block;animation:slideDown 0.3s ease}
    @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .e-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:block}
    .e-input{width:100%;background:#111;border:1px solid var(--border);padding:11px 13px;border-radius:7px;color:#fff;font-family:'Oswald';font-size:14px;outline:none;margin-bottom:12px;transition:border-color 0.2s}
    .e-input:focus{border-color:var(--gold)}
    .e-input::placeholder{color:#555}
    .uid-box{background:rgba(184,134,11,0.08);border:1px solid rgba(184,134,11,0.35);border-radius:8px;padding:12px;margin-bottom:12px}
    .uid-box-title{font-family:'Teko';font-size:15px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .uid-note{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
    .reauth-row{display:flex;gap:8px;margin-bottom:10px}
    .reauth-btn{flex:1;padding:10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:'Oswald';font-size:13px;font-weight:700;cursor:pointer;letter-spacing:0.5px;transition:0.2s;display:flex;align-items:center;justify-content:center;gap:6px}
    .reauth-btn.active{border-color:var(--gold);background:rgba(254,203,0,0.1);color:var(--gold)}
    .btn-row{display:flex;gap:8px}
    .save-btn{flex:1;padding:12px;background:linear-gradient(180deg,var(--amber),var(--amber-deep));border:1px solid var(--gold);color:var(--gold);font-family:'Teko';font-size:18px;letter-spacing:2px;border-radius:7px;cursor:pointer;text-transform:uppercase}
    .cancel-btn{padding:12px 16px;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Teko';font-size:18px;border-radius:7px;cursor:pointer}
    .msg{text-align:center;padding:8px;border-radius:6px;font-size:13px;font-weight:600;display:none;margin-bottom:10px}
    .msg.error{display:block;background:rgba(255,50,50,0.1);border:1px solid rgba(255,50,50,0.3);color:var(--danger)}
    .msg.success{display:block;background:rgba(92,255,138,0.1);border:1px solid rgba(92,255,138,0.3);color:var(--green)}

    .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;position:relative;overflow:hidden}
    .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),var(--gold))}
    .stat-icon{font-size:24px;margin-bottom:4px}
    .stat-value{font-family:'Teko',sans-serif;font-size:30px;color:var(--gold);letter-spacing:1px}
    .stat-label{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}

    .wallet-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,0.5)}
    .wallet-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--amber),var(--gold))}
    .w-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .w-balance{font-family:'Teko',sans-serif;font-size:48px;color:var(--gold);letter-spacing:2px;line-height:1;margin-bottom:14px}
    .w-actions{display:flex;gap:10px;margin-bottom:16px}
    .btn-deposit{flex:1;padding:12px;border-radius:7px;background:linear-gradient(180deg,var(--amber),var(--amber-deep));border:1px solid var(--gold);color:var(--gold);font-family:'Teko';font-size:18px;letter-spacing:2px;cursor:pointer;text-transform:uppercase}
    .btn-withdraw{flex:1;padding:12px;border:1px solid var(--gold);border-radius:7px;background:rgba(254,203,0,0.05);color:var(--gold);font-family:'Teko';font-size:18px;letter-spacing:2px;cursor:pointer;text-transform:uppercase}

    .tx-title{font-family:'Teko',sans-serif;font-size:16px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;border-left:3px solid var(--gold);padding-left:8px}
    .tx-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:7px;margin-bottom:6px;border-left:3px solid var(--border)}
    .tx-item.deposit{border-left-color:var(--green)}
    .tx-item.withdraw{border-left-color:var(--amber)}
    .tx-item.prize{border-left-color:var(--gold)}
    .tx-left{display:flex;align-items:center;gap:10px}
    .tx-icon{font-size:18px}
    .tx-desc{font-size:13px;font-weight:600;letter-spacing:0.5px}
    .tx-date{font-size:11px;color:var(--muted);margin-top:1px}
    .tx-right{text-align:right}
    .tx-amount{font-family:'Teko',sans-serif;font-size:18px;letter-spacing:1px}
    .tx-amount.plus{color:var(--green)}
    .tx-amount.minus{color:var(--danger)}
    .status-pill{font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:20px;margin-top:2px;display:inline-block}
    .status-pill.pending{background:rgba(254,203,0,0.15);color:var(--gold);border:1px solid rgba(254,203,0,0.3)}
    .status-pill.approved{background:rgba(92,255,138,0.15);color:var(--green);border:1px solid rgba(92,255,138,0.3)}
    .status-pill.rejected{background:rgba(255,107,107,0.15);color:var(--danger);border:1px solid rgba(255,107,107,0.3)}
    .no-tx{text-align:center;color:var(--muted);font-size:13px;padding:14px}

    .sec-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
    .sec-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),var(--gold),transparent)}
    .sec-head{font-family:'Teko',sans-serif;font-size:18px;color:#fff;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;border-left:3px solid var(--gold);padding-left:8px}

    .history-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;border-left:3px solid var(--gold)}
    .hist-name{font-family:'Teko';font-size:17px;color:#fff;letter-spacing:1px;margin-bottom:3px}
    .hist-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
    .hist-meta span{color:var(--gold)}

    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;align-items:flex-end;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:#111;border:1px solid var(--gold);border-radius:16px 16px 0 0;padding:24px 20px;width:100%;max-width:500px;animation:slideUp 0.3s ease both;border-top:3px solid var(--gold)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-title{font-family:'Teko',sans-serif;font-size:26px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:16px}
    .m-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:block}
    .m-input{width:100%;background:#000;border:1px solid var(--border);padding:12px 13px;border-radius:7px;color:#fff;font-family:'Oswald';font-size:14px;outline:none;margin-bottom:12px;transition:border-color 0.2s}
    .m-input:focus{border-color:var(--gold)}
    .m-input::placeholder{color:#555}
    .m-method-row{display:flex;gap:10px;margin-bottom:14px}
    .m-method-btn{flex:1;padding:11px;border-radius:7px;border:2px solid var(--border);background:transparent;color:var(--text);font-family:'Oswald';font-size:14px;font-weight:700;cursor:pointer;transition:0.2s}
    .m-method-btn.selected{border-color:var(--gold);background:rgba(254,203,0,0.1);color:var(--gold)}
    .pay-info{background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:8px;padding:13px;font-size:13px;line-height:1.8;margin-bottom:12px;color:var(--muted);display:none}
    .pay-info.show{display:block}
    .pay-number{color:var(--gold);font-family:'Teko';font-size:20px;font-weight:700}
    .m-btn{width:100%;padding:13px;border:1px solid var(--gold);border-radius:7px;background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:var(--gold);font-family:'Teko';font-size:20px;letter-spacing:2px;cursor:pointer;margin-bottom:10px;text-transform:uppercase}
    .m-cancel{width:100%;padding:11px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);font-family:'Oswald';font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-transform:uppercase;letter-spacing:1px}

    /* FOOTER NAV */
    .footer-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,0.95);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:10px 0;z-index:100;backdrop-filter:blur(10px)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:1px;transition:0.2s}
    .nav-item i{font-size:20px}
    .nav-item.active{color:var(--gold)}
    .nav-item.active i{transform:scale(1.1)}
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-wrap">
      <img src="logo.png" alt="Logo" class="logo-img">
      <span class="header-title">PROFILE</span>
    </div>
    <div class="wallet-badge">৳ <span id="nav-balance">0</span></div>
  </header>

  <main class="content">
    <div id="profile-wrap"></div>
    <div id="stats-wrap"></div>
    <div id="wallet-wrap"></div>
    <div id="history-wrap"></div>
  </main>

  <nav class="footer-nav">
    <a href="home.html" class="nav-item"><i>🏠</i><span>HOME</span></a>
    <a href="tournaments.html" class="nav-item"><i>🎮</i><span>PLAY</span></a>
    <a href="dashboard.html" class="nav-item active"><i>👤</i><span>PROFILE</span></a>
  </nav>

  <div class="modal-overlay" id="deposit-modal">
    <div class="modal">
      <h2 class="modal-title">Add Money</h2>
      <label class="m-label">Select Method</label>
      <div class="m-method-row">
        <button class="m-method-btn" onclick="selMethod('Bkash',this)">Bkash</button>
        <button class="m-method-btn" onclick="selMethod('Nagad',this)">Nagad</button>
      </div>
      <div class="pay-info" id="pay-info">
        Send money to: <span class="pay-number" id="admin-num">01XXXXXXXXX</span> (Personal)<br>
        1. Copy number & Go to app<br>
        2. Send money (Min ৳10)<br>
        3. Enter amount & number below
      </div>
      <label class="m-label">Amount (৳)</label>
      <input type="number" id="dep-amount" class="m-input" placeholder="Min ৳10">
      <label class="m-label">Your Number</label>
      <input type="text" id="dep-number" class="m-input" placeholder="01XXXXXXXXX">
      <div id="dep-msg" class="msg"></div>
      <button class="m-btn" onclick="submitDeposit()">Submit Request</button>
      <div class="m-cancel" onclick="closeModal('deposit-modal')">Cancel</div>
    </div>
  </div>

  <div class="modal-overlay" id="withdraw-modal">
    <div class="modal">
      <h2 class="modal-title">Cash Out</h2>
      <label class="m-label">Select Method</label>
      <div class="m-method-row">
        <button class="m-method-btn" onclick="selMethodW('Bkash',this)">Bkash</button>
        <button class="m-method-btn" onclick="selMethodW('Nagad',this)">Nagad</button>
      </div>
      <label class="m-label">Withdraw Amount (৳)</label>
      <input type="number" id="withdraw-amount" class="m-input" placeholder="Enter amount">
      <label class="m-label">Your Number</label>
      <input type="text" id="withdraw-number" class="m-input" placeholder="01XXXXXXXXX">
      <div id="withdraw-msg" class="msg"></div>
      <button class="m-btn" onclick="submitWithdrawal()">Withdraw Now</button>
      <div class="m-cancel" onclick="closeModal('withdraw-modal')">Cancel</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, EmailAuthProvider, GoogleAuthProvider, reauthenticateWithCredential, reauthenticateWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { /* Your Config */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userData = null;
    let selDMethod = '';
    let selWMethod = '';

    onAuthStateChanged(auth, async (user) => {
      if(user){
        currentUser = user;
        const ref = doc(db, 'users', user.uid);
        const snap = await getDoc(ref);
        if(snap.exists()){
          userData = snap.data();
          renderProfile();
          renderStats();
          renderWallet();
          loadTransactions(user.uid);
          loadRegistrations(user.uid);
          document.getElementById('nav-balance').textContent = userData.balance || 0;
        }
      } else {
        window.location.href = 'index.html';
      }
    });

    function renderProfile(){
      const initial = (userData.name || userData.game_name || 'P')[0].toUpperCase();
      document.getElementById('profile-wrap').innerHTML = `
        <div class="profile-card">
          <div class="profile-banner">
            <div class="avatar">${initial}</div>
            <div class="profile-info">
              <div class="game-name">${userData.game_name || 'New Player'}</div>
              <div class="player-name">${userData.name || ''}</div>
              <div class="player-email">${currentUser.email}</div>
              <div class="player-whatsapp">📞 ${userData.whatsapp || 'No WhatsApp'}</div>
              <div class="uid-tag">UID: ${userData.uid_game || 'Not Set'}</div>
            </div>
            <div class="edit-icon" onclick="toggleEdit()">✎</div>
          </div>
          <div class="edit-panel" id="edit-panel">
            <div id="edit-msg" class="msg"></div>
            <label class="e-label">Full Name</label>
            <input type="text" id="e-name" class="e-input" value="${userData.name || ''}">
            <label class="e-label">WhatsApp Number</label>
            <input type="text" id="e-whatsapp" class="e-input" value="${userData.whatsapp || ''}">
            
            <div class="uid-box">
              <div class="uid-box-title"><span>🆔</span> Game UID</div>
              ${!userData.uid_changed ? `
                <p class="uid-note">You can set your Game UID for free once.</p>
                <input type="text" id="e-uid" class="e-input" value="${userData.uid_game || ''}" placeholder="Enter Game UID">
              ` : `
                <p class="uid-note">UID verified. Contact admin to change.</p>
                <input type="text" class="e-input" value="${userData.uid_game}" disabled>
              `}
            </div>

            <div class="btn-row">
              <button class="save-btn" onclick="saveProfile()">Save Profile</button>
              <button class="cancel-btn" onclick="toggleEdit()">X</button>
            </div>
            <button onclick="doLogout()" style="width:100%;margin-top:15px;background:none;border:none;color:var(--danger);font-family:'Teko';font-size:18px;cursor:pointer">LOGOUT ACCOUNT</button>
          </div>
        </div>`;
    }

    window.toggleEdit = () => document.getElementById('edit-panel').classList.toggle('open');

    window.saveProfile = async () => {
      const name = document.getElementById('e-name').value.trim();
      const whatsapp = document.getElementById('e-whatsapp').value.trim();
      const updates = { name, whatsapp };

      if (!userData.uid_changed) {
        const newUid = document.getElementById('e-uid').value.trim();
        if (newUid && newUid !== userData.uid_game) {
          updates.uid_game = newUid;
          updates.uid_changed = true;
        }
      }

      try {
        await updateDoc(doc(db, 'users', currentUser.uid), updates);
        userData = { ...userData, ...updates };
        renderProfile();
        showMsg('edit-msg', 'Profile updated!', 'success');
      } catch (e) {
        showMsg('edit-msg', 'Update failed.', 'error');
      }
    };

    async function loadTransactions(uid) {
      const q = query(collection(db, 'transactions'), where('uid', '==', uid));
      const snap = await getDocs(q);
      const list = document.getElementById('tx-list');
      if (snap.empty) {
        list.innerHTML = '<div class="no-tx">No recent transactions.</div>';
        return;
      }
      
      let txs = [];
      snap.forEach(d => txs.push(d.data()));
      txs.sort((a, b) => b.created_at?.toMillis() - a.created_at?.toMillis());

      list.innerHTML = txs.map(t => `
        <div class="tx-item ${t.type}">
          <div class="tx-left">
            <div class="tx-icon">${t.type === 'prize' ? '🏆' : t.type === 'deposit' ? '💰' : '💸'}</div>
            <div>
              <div class="tx-desc">${t.reason || t.type.toUpperCase()}</div>
              <div class="tx-date">${t.created_at ? t.created_at.toDate().toLocaleDateString() : 'Pending...'}</div>
            </div>
          </div>
          <div class="tx-right">
            <div class="tx-amount ${['deposit', 'prize'].includes(t.type) ? 'plus' : 'minus'}">
              ${['deposit', 'prize'].includes(t.type) ? '+' : '-'}৳${t.amount}
            </div>
            <div class="status-pill ${t.status}">${t.status.toUpperCase()}</div>
          </div>
        </div>
      `).join('');
    }

    // Additional helper functions (renderStats, renderWallet, etc.) would follow same pattern.
  </script>
</body>
</html>
