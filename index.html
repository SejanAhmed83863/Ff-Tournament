<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Tournament Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; padding: 15px; }
        
        .header { text-align: center; padding: 20px 0; }
        .header h1 { color: #f59e0b; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        
        .tournament-card { 
            background: #1e293b; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-bottom: 25px; 
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        
        .banner { width: 100%; height: 180px; background: linear-gradient(45deg, #f59e0b, #ef4444); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        
        .details { padding: 20px; }
        .title { font-size: 20px; margin-bottom: 10px; color: #fff; }
        
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #334155; padding: 10px; border-radius: 10px; text-align: center; }
        .stat-label { font-size: 12px; color: #94a3b8; display: block; }
        .stat-value { font-size: 16px; font-weight: bold; color: #f59e0b; }
        
        .btn-join { 
            display: block; 
            background: #f59e0b; 
            color: #000; 
            text-align: center; 
            padding: 15px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px;
            transition: 0.3s;
        }
        
        .btn-join:active { transform: scale(0.98); background: #d97706; }
        
        .status-badge { background: #22c55e; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>FF Battle Arena</h1>
    </div>

    <div class="tournament-card">
        <div class="banner">FREE FIRE SOLO</div>
        <div class="details">
            <span class="status-badge">Registration Open</span>
            <h2 class="title">Solo Battle Royale - Season 1</h2>
            
            <div class="stats">
                <div class="stat-box">
                    <span class="stat-label">Entry Fee</span>
                    <span class="stat-value">FREE</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Prize Pool</span>
                    <span class="stat-value">500💎</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Map</span>
                    <span class="stat-value">Bermuda</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Time</span>
                    <span class="stat-value">08:00 PM</span>
                </div>
            </div>

            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfM_qWxi5HdaDCIAxAheQjpKN4SHiq77ARUayaZYOyhu4EhUQ/viewform" class="btn-join">JOIN NOW</a>
        </div>
    </div>

    <div class="tournament-card" style="opacity: 0.7;">
        <div class="banner" style="background: #475569;">SQUAD MATCH</div>
        <div class="details">
            <h2 class="title">Squad Showdown</h2>
            <p style="text-align: center; color: #94a3b8;">Coming next week...</p>
        </div>
    </div>

</body>
</html>
