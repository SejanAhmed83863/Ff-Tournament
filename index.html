<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FF Tournament Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Oswald:wght@500;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Oswald', sans-serif; background: #000; color: #fff; padding: 10px; background-image: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,1)), url('https://w0.peakpx.com/wallpaper/701/320/wallpaper-free-fire-logo-esports.jpg'); background-size: cover; background-position: center; background-attachment: fixed; }
        .page { display: none; padding-bottom: 90px; }
        .active { display: block; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #fecb00; padding-bottom: 10px; }
        .header h2 { font-family: 'Teko', sans-serif; font-size: 38px; color: #fff; text-transform: uppercase; text-shadow: 2px 2px #ec1c24; }
        .header h2 span { color: #fecb00; }
        .card { background: rgba(26, 26, 26, 0.95); border-radius: 15px; margin-bottom: 15px; border: 1px solid #444; overflow: hidden; }
        .btn-red { display: block; width: 100%; background: linear-gradient(180deg, #ec1c24 0%, #a01015 100%); color: #fff; text-align: center; padding: 15px; border-radius: 8px; font-family: 'Teko', sans-serif; font-size: 22px; text-transform: uppercase; border: none; cursor: pointer; }
        .back-btn { color: #fecb00; cursor: pointer; text-transform: uppercase; font-size: 14px; border: 1px solid #fecb00; padding: 5px 10px; border-radius: 5px; display: inline-block; margin-bottom: 15px; }
        .input-field { width: 100%; background: #111; border: 1px solid #444; padding: 12px; border-radius: 8px; color: #fff; margin-bottom: 12px; font-family: 'Oswald'; }
        .btn-fixed { position: fixed; bottom: 10px; left: 10px; right: 10px; z-index: 100; }
        .prize-grid { display: flex; justify-content: space-around; text-align: center; margin: 15px 0; }
        .rank { padding: 10px; border-radius: 8px; border: 1px solid #444; width: 30%; }
        .rank-1 { background: #fecb00; color: #000; transform: scale(1.1); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header"><h2>FF <span>Arena</span></h2></div>

    <div id="lobbyPage" class="page active">
        <div class="card">
            <img src="https://img.freepik.com/free-vector/free-fire-tournament-banner-template_23-2149206144.jpg" style="width: 100%;">
            <div style="padding:15px;">
                <h2 style="font-family:'Teko'; color:#fecb00; font-size:28px;">SQUAD BATTLE ROYALE</h2>
                <p>Entry: 50 TK | Total Prize: 2700 TK</p>
                <button class="btn-red" onclick="openDetails('Squad', '1500', '800', '400', '50', 'Bermuda', '08:00 PM')">View Details</button>
            </div>
        </div>
        <div class="card">
            <div style="padding:15px;">
                <h2 style="font-family:'Teko'; color:#fecb00; font-size:28px;">SOLO DIAMOND RUSH</h2>
                <p>Entry: 20 TK | Prize: 500💎</p>
                <button class="btn-red" onclick="openDetails('Solo', '300', '150', '50', '20', 'Purgatory', '09:00 PM')">View Details</button>
            </div>
        </div>
    </div>

    <div id="detailsPage" class="page">
        <div class="back-btn" onclick="showPage('lobbyPage')">← Back to Lobby</div>
        <div class="card" style="padding:15px;">
            <h2 id="detTitle" style="font-family:'Teko'; color:#fecb00; font-size:30px;"></h2>
            <div class="prize-grid">
                <div class="rank">🥈 <br> <span id="p2"></span></div>
                <div class="rank rank-1">🏆 <br> <span id="p1"></span></div>
                <div class="rank">🥉 <br> <span id="p3"></span></div>
            </div>
            <p>🗺️ Map: <span id="detMap"></span></p>
            <p>⏰ Time: <span id="detTime"></span></p>
            <p>💵 Entry: <span id="detEntry"></span></p>
        </div>
        <div class="btn-fixed"><button class="btn-red" onclick="openReg()">Join Tournament</button></div>
    </div>

    <div id="regPage" class="page">
        <div class="back-btn" onclick="showPage('detailsPage')">← Back</div>
        <div class="card" style="padding:15px;">
            <h3 style="font-family:'Teko'; color:#ec1c24; font-size:26px; margin-bottom:10px;">Player Info</h3>
            <input type="text" id="teamName" class="input-field" placeholder="Team Name (N/A for Solo)">
            <div id="uidInputs"></div>
            <input type="tel" id="whatsapp" class="input-field" placeholder="WhatsApp Number">
        </div>
        <div class="btn-fixed"><button class="btn-red" onclick="showPage('payPage')">Next: Payment</button></div>
    </div>

    <div id="payPage" class="page">
        <div class="back-btn" onclick="showPage('regPage')">← Back</div>
        <div class="card" style="padding:15px; text-align:center;">
            <h3 style="font-family:'Teko'; color:#fecb00; font-size:26px;">Payment Method</h3>
            <p>bKash/Nagad (Send Money):</p>
            <h2 style="color:#ec1c24; margin:10px 0;">01301516532</h2>
            <input type="text" id="txid" class="input-field" placeholder="Transaction ID / Last 4 Digits">
        </div>
        <div class="btn-fixed"><button class="btn-red" onclick="submitData()">Confirm Registration</button></div>
    </div>

    <script>
        let currentMode = '';
        const scriptURL = 'কাল_আপনার_লিঙ্ক_এখানে_বসবে'; 

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function openDetails(mode, pr1, pr2, pr3, ent, map, time) {
            currentMode = mode;
            document.getElementById('detTitle').innerText = mode + " Tournament";
            document.getElementById('p1').innerText = pr1 + " TK";
            document.getElementById('p2').innerText = pr2 + " TK";
            document.getElementById('p3').innerText = pr3 + " TK";
            document.getElementById('detMap').innerText = map;
            document.getElementById('detTime').innerText = time;
            document.getElementById('detEntry').innerText = ent + " TK";
            showPage('detailsPage');
        }

        function openReg() {
            const container = document.getElementById('uidInputs');
            container.innerHTML = '';
            const count = (currentMode === 'Solo') ? 1 : 4;
            for(let i=1; i<=count; i++) {
                container.innerHTML += `<input type="text" class="input-field uid-in" placeholder="Player ${i} UID">`;
            }
            showPage('regPage');
        }

        function submitData() {
            // কাল এখানে fetch() কোডটি যোগ করবো
            alert('কাল লিঙ্ক বসালে এটি কাজ করবে!');
        }
    </script>
</body>
</html>
