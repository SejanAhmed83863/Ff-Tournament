<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jahanabad Tournament Club - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #FFD700; --amber: #b8860b; --dark: #0A0A0F; --card: #12121A; --border: #2A2A3A; --text: #E8E8F0; --muted: #6B6B80; }
    body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,215,0,0.12) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(184,134,11,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(184,134,11,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .container { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 20px; animation: fadeUp 0.6s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo-img { width: 110px; height: 110px; border-radius: 16px; object-fit: cover; border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(255,215,0,0.35); margin-bottom: 12px; }
    .logo h1 { font-family: 'Bebas Neue'; font-size: 36px; letter-spacing: 4px; background: linear-gradient(135deg, var(--gold), var(--amber)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
    .logo p { color: var(--muted); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--amber), var(--gold), transparent); }
    .tabs { display: flex; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 4px; margin-bottom: 22px; gap: 4px; }
    .tab { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); font-family: 'Rajdhani'; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: all 0.25s ease; }
    .tab.active { background: linear-gradient(135deg, var(--amber), #6b4f00); color: var(--gold); box-shadow: 0 4px 15px rgba(184,134,11,0.4); }
    .form { display: none; }
    .form.active { display: block; animation: fadeUp 0.3s ease both; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .field input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Rajdhani'; font-size: 15px; font-weight: 600; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,0,0.15); }
    .field input::placeholder { color: var(--muted); font-weight: 400; }
    .btn { width: 100%; padding: 14px; border: 1px solid var(--gold); border-radius: 10px; background: linear-gradient(135deg, var(--amber), #6b4f00); color: var(--gold); font-family: 'Bebas Neue'; font-size: 20px; letter-spacing: 3px; cursor: pointer; margin-top: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message { margin-top: 14px; padding: 11px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; display: none; }
    .message.error   { display: block; background: rgba(255,50,50,0.1);   border: 1px solid rgba(255,50,50,0.3);   color: #FF6B6B; }
    .message.success { display: block; background: rgba(50,255,100,0.1);  border: 1px solid rgba(50,255,100,0.3);  color: #5CFF8A; }
    .message.info    { display: block; background: rgba(255,215,0,0.08);  border: 1px solid rgba(255,215,0,0.3);   color: var(--gold); }
    .forgot-link { text-align: right; margin-top: -6px; margin-bottom: 10px; }
    .forgot-link button { background: none; border: none; color: var(--gold); font-family: 'Rajdhani'; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px; padding: 0; }
    .forgot-link button:hover { text-decoration: underline; }
    .resend-link { text-align: center; margin-top: 8px; }
    .resend-link button { background: none; border: none; color: var(--amber); font-family: 'Rajdhani'; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px; padding: 0; display: none; }
    .resend-link button.show { display: inline-block; }
    .resend-link button:hover { text-decoration: underline; }
    /* Verification pending box */
    .verify-box { display: none; text-align: center; padding: 20px 0; }
    .verify-box.show { display: block; }
    .verify-icon { font-size: 48px; margin-bottom: 12px; }
    .verify-title { font-family: 'Bebas Neue'; font-size: 24px; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; }
    .verify-text { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 16px; }
    .verify-email-highlight { color: var(--text); font-weight: 700; }
    .btn-small { padding: 10px 20px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--muted); font-family: 'Rajdhani'; font-size: 14px; font-weight: 700; cursor: pointer; margin: 4px; }
    .btn-small:hover { border-color: var(--gold); color: var(--gold); }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img class="logo-img" src="logo.png" alt="Jahanabad Tournament Club"/>
    <h1>Jahanabad TC</h1>
    <p>Prove Your Skill · BOOYAH!</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div class="form active" id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="your@email.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••"/></div>
      <div class="forgot-link">
        <button onclick="forgotPassword()">🔑 Forgot Password?</button>
      </div>
      <button class="btn" id="login-btn" onclick="loginEmail()">Enter Arena</button>
      <div class="resend-link">
        <button id="resend-btn" onclick="resendVerification()">📧 Resend Verification Email</button>
      </div>
      <div class="message" id="login-msg"></div>
    </div>

    <!-- REGISTER FORM -->
    <div class="form" id="register-form">
      <!-- Registration fields -->
      <div id="reg-fields">
        <div class="field"><label>Full Name</label><input type="text" id="reg-name" placeholder="Your Name"/></div>
        <div class="field"><label>WhatsApp Number</label><input type="tel" id="reg-whatsapp" placeholder="01XXXXXXXXX"/></div>
        <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="your@email.com"/></div>
        <div class="field"><label>Password</label><input type="password" id="reg-pass" placeholder="Min 6 characters"/></div>
        <div class="field"><label>Confirm Password</label><input type="password" id="reg-pass2" placeholder="Repeat password"/></div>
        <button class="btn" id="reg-btn" onclick="registerEmail()">Join Tournament</button>
        <div class="message" id="reg-msg"></div>
      </div>
      <!-- Email verification pending box -->
      <div class="verify-box" id="verify-box">
        <div class="verify-icon">📧</div>
        <div class="verify-title">Check Your Email</div>
        <div class="verify-text">
          We sent a verification link to<br>
          <span class="verify-email-highlight" id="verify-email-display"></span><br><br>
          Click the link in the email to activate your account, then come back and log in.
        </div>
        <button class="btn-small" onclick="switchTab('login')">Go to Login</button>
        <button class="btn-small" onclick="resendRegVerification()">Resend Email</button>
        <div class="message" id="verify-msg"></div>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, updateProfile,
    sendPasswordResetEmail, sendEmailVerification, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const ADMIN_EMAIL = 'sejansasker@gmail.com';

  const firebaseConfig = {
    apiKey: "AIzaSyBgMroBilivfk7bJxoz93HjxSt6yU7Ura0",
    authDomain: "tournament-app-4a050.firebaseapp.com",
    projectId: "tournament-app-4a050",
    storageBucket: "tournament-app-4a050.firebasestorage.app",
    messagingSenderId: "811957533858",
    appId: "1:811957533858:web:1d1f0f916c0aba5eccebfb"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // Holds the last unverified user for resend on login page
  let unverifiedUser = null;
  // Holds registered user for resend on verify box
  let registeredUser = null;

  // ─── Auth state — only used for LOGIN redirect ────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    // Only redirect verified email users or admin (registration is handled inline)
    const isEmail = user.providerData.some(p => p.providerId === 'password');
    if (isEmail && !user.emailVerified && user.email !== ADMIN_EMAIL) {
      // not verified — don't redirect
      return;
    }
    window.location.href = 'home.html';
  });

  // ─── Tab switch ───────────────────────────────────────────────────────────
  window.switchTab = (tab) => {
    document.querySelectorAll('.tab').forEach((t, i) =>
      t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1))
    );
    document.getElementById('login-form').classList.toggle('active', tab === 'login');
    document.getElementById('register-form').classList.toggle('active', tab === 'register');
    if (tab === 'register') {
      document.getElementById('reg-fields').style.display = '';
      document.getElementById('verify-box').classList.remove('show');
      document.getElementById('reg-btn').disabled = false;
      document.getElementById('reg-btn').textContent = 'Join Tournament';
    }
  };

  function showMsg(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `message ${type}`;
  }

  // ─── Login ────────────────────────────────────────────────────────────────
  window.loginEmail = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    if (!email || !pass) return showMsg('login-msg', 'Please fill in all fields.', 'error');

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing In...';
    document.getElementById('resend-btn').classList.remove('show');

    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      const user = cred.user;

      if (user.email === ADMIN_EMAIL) {
        window.location.href = 'home.html';
        return;
      }

      if (!user.emailVerified) {
        unverifiedUser = user;
        await signOut(auth);
        showMsg('login-msg', '📧 Please verify your email first. Check your inbox!', 'info');
        document.getElementById('resend-btn').classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Enter Arena';
        return;
      }
      // Verified — onAuthStateChanged will redirect
    } catch(e) {
      btn.disabled = false;
      btn.textContent = 'Enter Arena';
      if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(e.code)) {
        showMsg('login-msg', '❌ Invalid email or password.', 'error');
      } else if (e.code === 'auth/too-many-requests') {
        showMsg('login-msg', '⏳ Too many attempts. Wait a moment and try again.', 'error');
      } else {
        showMsg('login-msg', e.message, 'error');
      }
    }
  };

  // ─── Register — fully inline, no onAuthStateChanged dependency ───────────
  window.registerEmail = async () => {
    const name     = document.getElementById('reg-name').value.trim();
    const whatsapp = document.getElementById('reg-whatsapp').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const pass     = document.getElementById('reg-pass').value;
    const pass2    = document.getElementById('reg-pass2').value;

    if (!name || !whatsapp || !email || !pass || !pass2)
      return showMsg('reg-msg', 'Please fill in all fields.', 'error');
    if (whatsapp.replace(/\D/g,'').length < 11)
      return showMsg('reg-msg', 'Enter a valid 11-digit WhatsApp number.', 'error');
    if (pass !== pass2)
      return showMsg('reg-msg', 'Passwords do not match!', 'error');
    if (pass.length < 6)
      return showMsg('reg-msg', 'Password must be at least 6 characters.', 'error');

    const btn = document.getElementById('reg-btn');
    btn.disabled = true;
    btn.textContent = 'Creating Account...';

    try {
      // 1. Create the Firebase Auth user
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      const user = cred.user;

      // 2. Update display name
      try { await updateProfile(user, { displayName: name }); } catch(_) {}

      // 3. Save user data to Firestore IMMEDIATELY (inline, no listener)
      await setDoc(doc(db, 'users', user.uid), {
        name,
        whatsapp,
        email: user.email,
        provider: 'password',
        game_name: '',
        uid_game: '',
        balance: 0,
        played: 0,
        wins: 0,
        total_earned: 0,
        uid_changed: false,
        created_at: new Date().toISOString()
      });

      // 4. Send verification email
      try { await sendEmailVerification(user); } catch(_) {}

      // 5. Sign out so unverified user can't slip through
      registeredUser = user;
      await signOut(auth);

      // 6. Show verification pending UI
      document.getElementById('verify-email-display').textContent = user.email;
      document.getElementById('reg-fields').style.display = 'none';
      document.getElementById('verify-box').classList.add('show');

    } catch(e) {
      btn.disabled = false;
      btn.textContent = 'Join Tournament';
      if (e.code === 'auth/email-already-in-use') {
        showMsg('reg-msg', '📧 Email already registered. Try logging in or use Forgot Password.', 'error');
      } else if (e.code === 'auth/weak-password') {
        showMsg('reg-msg', '🔒 Password too weak. Use at least 6 characters.', 'error');
      } else if (e.code === 'auth/invalid-email') {
        showMsg('reg-msg', '❌ Invalid email address.', 'error');
      } else {
        showMsg('reg-msg', 'Registration failed: ' + e.message, 'error');
      }
    }
  };

  // ─── Forgot Password ──────────────────────────────────────────────────────
  window.forgotPassword = async () => {
    const email = document.getElementById('login-email').value.trim();
    if (!email) {
      showMsg('login-msg', '📧 Enter your email address above first.', 'error');
      document.getElementById('login-email').focus();
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      showMsg('login-msg', `✅ Password reset link sent to ${email}. Check your inbox!`, 'success');
    } catch(e) {
      if (e.code === 'auth/user-not-found') {
        showMsg('login-msg', '❌ No account found with this email.', 'error');
      } else {
        showMsg('login-msg', 'Could not send reset email. Check the address.', 'error');
      }
    }
  };

  // ─── Resend Verification (login page) ────────────────────────────────────
  window.resendVerification = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    if (!email || !pass) {
      showMsg('login-msg', 'Enter your email and password to resend verification.', 'error');
      return;
    }
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      await sendEmailVerification(cred.user);
      await signOut(auth);
      showMsg('login-msg', '✅ Verification email resent! Check your inbox.', 'success');
    } catch(e) {
      showMsg('login-msg', 'Failed to resend. Check your credentials.', 'error');
    }
  };

  // ─── Resend Verification (verify box after register) ─────────────────────
  window.resendRegVerification = async () => {
    showMsg('verify-msg', '📧 Go to Login tab and use "Resend Verification Email" after entering your credentials.', 'info');
  };
</script>
</body>
</html>
