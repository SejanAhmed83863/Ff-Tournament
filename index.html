<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FF Tournament Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Oswald:wght@500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Oswald', sans-serif; 
            background: #000; 
            color: #fff; 
            padding: 10px; 
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,1)), url('https://w0.peakpx.com/wallpaper/701/320/wallpaper-free-fire-logo-esports.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #fecb00; padding-bottom: 10px; }
        .header h2 { font-family: 'Teko', sans-serif; font-size: 38px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .header h2 span { color: #fecb00; }

        /* Tournament List Card */
        .t-card { 
            background: rgba(30, 30, 30, 0.9); 
            border-radius: 15px; 
            margin-bottom: 20px; 
            border: 1px solid #333; 
            overflow: hidden;
            transition: 0.3s;
        }
        .t-banner { width: 100%; height: 140px; background: #222; object-fit: cover; }
        .t-content { padding: 15px; }
        .t-title { font-family: 'Teko', sans-serif; font-size: 26px; color: #fecb00; text-transform: uppercase; line-height: 1.2; }
        .t-meta { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin: 10px 0; border-top: 1px solid #444; padding-top: 10px; }
        .t-meta span { font-weight: bold; color: #fff; }

        .btn-view { 
            display: block; width: 100%; background: #ec1c24; color: #fff; text-align: center; 
            padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; text-transform: uppercase;
        }

        /* Detail & Registration Page (Hidden initially) */
        #detailsPage, #registrationPage { display: none; padding-bottom: 80px; }
        
        /* reuse old styles for sections */
        .section-card { background: rgba(26, 26, 26, 0.9); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .info-item { background: rgba(50, 50, 50, 0.6); padding: 10px; border-radius: 8px; text-align: center; }
        .info-label { font-size: 11px; color: #aaa; display: block; }
        
        .prize-podium { display: flex; justify-content: center; align-items: flex-end; margin: 15px 0; }
        .prize-rank { width: 30%; padding: 10px; border-radius: 8px 8px 0 0; text-align: center; border: 1px solid #444; }
        .rank-1 { background: #fecb00; color: #000; height: 100px; transform: scale(1.1); font-weight: bold; }

        .back-btn { background: #444; color: #fff; padding: 5px 15px; border-radius: 5px; margin-bottom: 15px; display: inline-block; cursor: pointer; font-size: 14px; }

        .input-group { margin-bottom: 12px; }
        .input-field { width: 100%; background: #222; border: 1px solid #444; padding: 12px; border-radius: 8px; color: #fff; }

        .btn-fixed { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #ec1c24; color: #fff; padding: 15px; border-radius: 10px; text-align: center; font-family: 'Teko', sans-serif; font-size: 22px; font-weight: bold; border: none; z-index: 100; text-transform: uppercase;}
    </style>
</head>
<body>

    <div class="header">
        <h2>FF <span>Arena</span> Lobby</h2>
    </div>

    <div id="lobbyPage">
        <div class="t-card">
            <img src="https://via.placeholder.com/400x200?text=Squad+Battle+May+24" class="t-banner">
            <div class="t-content">
                <div class="t-title">Squad Battle - Season 10</div>
                <div class="t-meta">
                    <div>Entry: <span>50 TK</span></div>
                    <div>Prize: <span>1500 TK</span></div>
                    <div>Mode: <span>Squad</span></div>
                </div>
                <button class="btn-view" onclick="showDetails('Squad Battle Season 10', '1500 TK', '50 TK')">View & Join</button>
            </div>
        </div>

        <div class="t-card">
            <img src="https://via.placeholder.com/400x200?text=Solo+Diamond+Rush" class="t-banner">
            <div class="t-content">
                <div class="t-title">Solo Diamond Rush</div>
                <div class="t-meta">
                    <div>Entry: <span>FREE</span></div>
                    <div>Prize: <span>500💎</span></div>
                    <div>Mode: <span>Solo</span></div>
                </div>
                <button class="btn-view" style="background: #555;">Details Soon</button>
            </div>
        </div>
    </div>

    <div id="detailsPage">
        <div class="back-btn" onclick="showLobby()">← Back to Lobby</div>
        <h2 id="detTitle" style="color: #fecb00; font-family: 'Teko', sans-serif; font-size: 30px; margin-bottom: 10px;"></h2>
        
        <div class="section-card info-grid">
            <div class="info-item"><span class="info-label">Mode</span> <span>Squad (4P)</span></div>
            <div class="info-item"><span class="info-label">Map</span> <span>Bermuda</span></div>
            <div class="info-item"><span class="info-label">Entry Fee</span> <span id="detEntry"></span></div>
            <div class="info-item"><span class="info-label">Date</span> <span>24 May 2024</span></div>
        </div>

        <div class="section-card" style="text-align: center;">
            <div class="prize-podium">
                <div class="prize-rank" style="height: 70px;">🥈<br>800 TK</div>
                <div class="prize-rank rank-1">🏆<br>1500 TK</div>
                <div class="prize-rank" style="height: 60px;">🥉<br>400 TK</div>
            </div>
        </div>

        <button class="btn-fixed" onclick="showRegistration()">Join Tournament Now</button>
    </div>

    <div id="registrationPage">
        <div class="back-btn" onclick="backToDetails()">← Back</div>
        <div class="section-card">
            <h2 style="color: #ec1c24; font-family: 'Teko', sans-serif; margin-bottom: 15px;">Team Registration</h2>
            <div class="input-group"><input type="text" id="teamName" class="input-field" placeholder="Team Name"></div>
            <div class="input-group"><input type="text" id="leaderDetails" class="input-field" placeholder="Leader Name & UID"></div>
            <div class="input-group"><input type="text" id="whatsapp" class="input-field" placeholder="WhatsApp Number"></div>
            <div class="input-group"><input type="text" id="p2" class="input-field" placeholder="Player 2 UID"></div>
            <div class="input-group"><input type="text" id="p3" class="input-field" placeholder="Player 3 UID"></div>
            <div class="input-group"><input type="text" id="p4" class="input-field" placeholder="Player 4 UID"></div>
            <div class="input-group"><input type="text" id="payment" class="input-field" placeholder="Payment Last 4 Digits"></div>
        </div>
        <button class="btn-fixed" onclick="submitFinal()">Confirm Registration</button>
    </div>

    <script>
        const lobby = document.getElementById('lobbyPage');
        const details = document.getElementById('detailsPage');
        const registration = document.getElementById('registrationPage');

        function showDetails(title, prize, entry) {
            document.getElementById('detTitle').innerText = title;
            document.getElementById('detEntry').innerText = entry;
            lobby.style.display = 'none';
            details.style.display = 'block';
            window.scrollTo(0,0);
        }

        function showLobby() {
            details.style.display = 'none';
            lobby.style.display = 'block';
        }

        function showRegistration() {
            details.style.display = 'none';
            registration.style.display = 'block';
            window.scrollTo(0,0);
        }

        function backToDetails() {
            registration.style.display = 'none';
            details.style.display = 'block';
        }

        function submitFinal() {
            alert('Sending Data to Admin...');
            // এখানে পরবর্তীতে Google Sheet এর fetch কোড বসবে
        }
    </script>

</body>
</html>
