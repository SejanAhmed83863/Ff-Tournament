<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jahanabad Tournament Club - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #FFD700; --amber: #b8860b; --dark: #0A0A0F; --card: #12121A; --border: #2A2A3A; --text: #E8E8F0; --muted: #6B6B80; }
    body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,215,0,0.12) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(184,134,11,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(184,134,11,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .container { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 20px; animation: fadeUp 0.6s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo-img { width: 110px; height: 110px; border-radius: 16px; object-fit: cover; border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(255,215,0,0.35); margin-bottom: 12px; }
    .logo h1 { font-family: 'Bebas Neue'; font-size: 36px; letter-spacing: 4px; background: linear-gradient(135deg, var(--gold), var(--amber)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
    .logo p { color: var(--muted); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--amber), var(--gold), transparent); }
    .tabs { display: flex; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 4px; margin-bottom: 22px; gap: 4px; }
    .tab { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); font-family: 'Rajdhani'; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: all 0.25s ease; }
    .tab.active { background: linear-gradient(135deg, var(--amber), #6b4f00); color: var(--gold); box-shadow: 0 4px 15px rgba(184,134,11,0.4); }
    .form { display: none; }
    .form.active { display: block; animation: fadeUp 0.3s ease both; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .field input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Rajdhani'; font-size: 15px; font-weight: 600; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,0,0.15); }
    .field input::placeholder { color: var(--muted); font-weight: 400; }
    .btn { width: 100%; padding: 14px; border: 1px solid var(--gold); border-radius: 10px; background: linear-gradient(135deg, var(--amber), #6b4f00); color: var(--gold); font-family: 'Bebas Neue'; font-size: 20px; letter-spacing: 3px; cursor: pointer; margin-top: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .btn-google { width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--text); font-family: 'Rajdhani'; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-google:hover { border-color: var(--gold); background: rgba(255,215,0,0.05); }
    .btn-google svg { width: 20px; height: 20px; }
    .message { margin-top: 14px; padding: 11px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; display: none; }
    .message.error { display: block; background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.3); color: #FF6B6B; }
    .message.success { display: block; background: rgba(50,255,100,0.1); border: 1px solid rgba(50,255,100,0.3); color: #5CFF8A; }
    .gname-modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; padding:20px; }
    .gname-modal-bg.open { display:flex; }
    .gname-modal { background:#12121A; border:1px solid var(--gold); border-radius:14px; padding:24px; width:100%; max-width:380px; }
    .gname-modal h3 { font-family:'Bebas Neue'; font-size:24px; color:var(--gold); letter-spacing:2px; margin-bottom:6px; }
    .gname-modal p { color:var(--muted); font-size:13px; margin-bottom:16px; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img class="logo-img" src="logo.png" alt="Jahanabad Tournament Club"/>
    <h1>Jahanabad TC</h1>
    <p>Prove Your Skill · BOOYAH!</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>
    <div class="form active" id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="your@email.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••"/></div>
      <div style="text-align: right; margin-top: -8px; margin-bottom: 12px;">
        <a href="#" onclick="showForgotPassword(); return false;" style="color: var(--gold); font-size: 12px; text-decoration: none; font-weight: 600; letter-spacing: 0.5px;">Forgot Password?</a>
      </div>
      <button class="btn" onclick="loginEmail()">Enter Arena</button>
      <div class="divider">or</div>
      <button class="btn-google" onclick="loginGoogle()">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="message" id="login-msg"></div>
    </div>
    <div class="form" id="register-form">
      <div class="field"><label>Full Name</label><input type="text" id="reg-name" placeholder="Your Name"/></div>
      <div class="field"><label>WhatsApp Number</label><input type="tel" id="reg-whatsapp" placeholder="01XXXXXXXXX"/></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="your@email.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="reg-pass" placeholder="Min 6 characters"/></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="reg-pass2" placeholder="Repeat password"/></div>
      <button class="btn" id="reg-btn" onclick="registerEmail()">Join Tournament</button>
      <div class="divider">or</div>
      <button class="btn-google" onclick="loginGoogle()">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="message" id="reg-msg"></div>
    </div>
  </div>
</div>

<!-- Google sign-in extra-info modal: ask for Name + WhatsApp on first Google login -->
<div class="gname-modal-bg" id="gname-modal">
  <div class="gname-modal">
    <h3>Complete Your Profile</h3>
    <p>We need a few more details before you continue.</p>
    <div class="field"><label>Full Name</label><input type="text" class="" id="g-name" placeholder="Your Name"/></div>
    <div class="field"><label>WhatsApp Number</label><input type="tel" id="g-whatsapp" placeholder="01XXXXXXXXX"/></div>
    <div class="message" id="g-msg"></div>
    <button class="btn" onclick="saveGoogleExtra()">Continue</button>
  </div>
</div>

<!-- Forgot Password modal -->
<div class="gname-modal-bg" id="forgot-modal">
  <div class="gname-modal">
    <h3>Reset Password</h3>
    <p>Enter your email and we'll send you a password reset link.</p>
    <div class="field"><label>Email Address</label><input type="email" id="forgot-email" placeholder="your@email.com"/></div>
    <div class="message" id="forgot-msg"></div>
    <button class="btn" onclick="sendPasswordReset()">Send Reset Link</button>
    <button class="btn" onclick="closeForgotPassword()" style="background: transparent; border: 1px solid var(--border); color: var(--muted); margin-top: 8px;">Cancel</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
           GoogleAuthProvider, signInWithPopup, onAuthStateChanged, updateProfile, 
           sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyBgMroBilivfk7bJxoz93HjxSt6yU7Ura0", 
    authDomain: "tournament-app-4a050.firebaseapp.com", 
    projectId: "tournament-app-4a050", 
    storageBucket: "tournament-app-4a050.firebasestorage.app", 
    messagingSenderId: "811957533858", 
    appId: "1:811957533858:web:1d1f0f916c0aba5eccebfb" 
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();
  
  let isRegistering = false;
  let pendingGoogleUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    
    // Skip if currently in registration flow
    if (isRegistering) return;
    
    const ref = doc(db, 'users', user.uid);
    const snap = await getDoc(ref);

    // First-time Google sign-in — needs Name + WhatsApp
    if (user.providerData && user.providerData[0]?.providerId === 'google.com') {
      if (!snap.exists() || !snap.data().name || !snap.data().whatsapp) {
        pendingGoogleUser = user;
        document.getElementById('g-name').value = (snap.exists() && snap.data().name) || user.displayName || '';
        document.getElementById('g-whatsapp').value = (snap.exists() && snap.data().whatsapp) || '';
        document.getElementById('gname-modal').classList.add('open');
        return;
      }
    }

    // Existing user — straight to home
    if (snap.exists()) {
      window.location.href = 'home.html';
    }
  });

  window.switchTab = (tab) => {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
    document.getElementById('login-form').classList.toggle('active', tab==='login');
    document.getElementById('register-form').classList.toggle('active', tab==='register');
  };
  
  function showMsg(id, msg, type) { 
    const el = document.getElementById(id); 
    el.textContent = msg; 
    el.className = `message ${type}`; 
  }

  window.loginEmail = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    
    if (!email || !pass) {
      return showMsg('login-msg', 'Please fill in all fields.', 'error');
    }
    
    try { 
      await signInWithEmailAndPassword(auth, email, pass); 
    } catch(e) { 
      console.error('Login error:', e);
      showMsg('login-msg', 'Invalid email or password.', 'error'); 
    }
  };

  window.registerEmail = async () => {
    const name = document.getElementById('reg-name').value.trim();
    const whatsapp = document.getElementById('reg-whatsapp').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;
    const pass2 = document.getElementById('reg-pass2').value;
    
    // Validation
    if (!name || !whatsapp || !email || !pass || !pass2) {
      return showMsg('reg-msg', 'Please fill in all fields.', 'error');
    }
    if (whatsapp.replace(/\D/g, '').length < 11) {
      return showMsg('reg-msg', 'Enter a valid 11-digit WhatsApp number.', 'error');
    }
    if (pass !== pass2) {
      return showMsg('reg-msg', 'Passwords do not match!', 'error');
    }
    if (pass.length < 6) {
      return showMsg('reg-msg', 'Password must be at least 6 characters.', 'error');
    }

    // Check if email already exists
    try {
      const q = query(collection(db, 'users'), where('email', '==', email));
      const existingUsers = await getDocs(q);
      if (!existingUsers.empty) {
        return showMsg('reg-msg', 'Email already registered.', 'error');
      }
    } catch (e) {
      console.error('Error checking existing email:', e);
    }

    // Disable button and show loading state
    const regBtn = document.getElementById('reg-btn');
    regBtn.disabled = true;
    regBtn.textContent = 'Registering...';
    isRegistering = true;

    try {
      // Create the user
      const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
      const user = userCredential.user;
      
      // Update display name
      try {
        await updateProfile(user, { displayName: name });
      } catch (profileError) {
        console.error('Error updating profile:', profileError);
      }

      // Create user document in Firestore
      const userRef = doc(db, 'users', user.uid);
      await setDoc(userRef, {
        name: name,
        whatsapp: whatsapp,
        game_name: '',
        uid_game: '',
        email: user.email,
        provider: 'password',
        balance: 0,
        played: 0,
        wins: 0,
        total_earned: 0,
        uid_changed: false,
        created_at: new Date().toISOString()
      });

      // Send verification email (optional)
      try {
        await sendEmailVerification(user);
        console.log('Verification email sent');
      } catch (verifyError) {
        console.error('Could not send verification email:', verifyError);
      }

      // Success message
      showMsg('reg-msg', '✅ Registration successful! Redirecting...', 'success');
      
      // Redirect to home page after a short delay
      setTimeout(() => {
        isRegistering = false;
        window.location.href = 'home.html';
      }, 1500);

    } catch (error) {
      isRegistering = false;
      regBtn.disabled = false;
      regBtn.textContent = 'Join Tournament';
      
      console.error('Registration error:', error);
      
      if (error.code === 'auth/email-already-in-use') {
        showMsg('reg-msg', 'Email already registered.', 'error');
      } else if (error.code === 'auth/weak-password') {
        showMsg('reg-msg', 'Password is too weak.', 'error');
      } else if (error.code === 'auth/invalid-email') {
        showMsg('reg-msg', 'Invalid email address.', 'error');
      } else {
        showMsg('reg-msg', 'Registration failed. Please try again.', 'error');
      }
    }
  };

  window.loginGoogle = async () => {
    try { 
      await signInWithPopup(auth, provider); 
    } catch(e) { 
      console.error('Google sign-in error:', e);
      showMsg('login-msg', 'Google sign-in failed. Try again.', 'error'); 
    }
  };

  window.saveGoogleExtra = async () => {
    const name = document.getElementById('g-name').value.trim();
    const whatsapp = document.getElementById('g-whatsapp').value.trim();
    
    if (!name) {
      return showMsg('g-msg', 'Please enter your name.', 'error');
    }
    if (whatsapp.replace(/\D/g, '').length < 11) {
      return showMsg('g-msg', 'Enter a valid 11-digit WhatsApp number.', 'error');
    }
    if (!pendingGoogleUser) return;
    
    const ref = doc(db, 'users', pendingGoogleUser.uid);
    const snap = await getDoc(ref);
    const base = snap.exists() ? snap.data() : { 
      game_name: '', 
      uid_game: '', 
      balance: 0, 
      played: 0, 
      wins: 0, 
      total_earned: 0, 
      uid_changed: false 
    };
    
    await setDoc(ref, { 
      ...base, 
      name, 
      whatsapp, 
      email: pendingGoogleUser.email, 
      provider: 'google', 
      created_at: base.created_at || new Date().toISOString() 
    }, { merge: true });
    
    window.location.href = 'home.html';
  };

  // Forgot Password functions
  window.showForgotPassword = () => {
    document.getElementById('forgot-email').value = '';
    document.getElementById('forgot-msg').className = 'message';
    document.getElementById('forgot-modal').classList.add('open');
  };

  window.closeForgotPassword = () => {
    document.getElementById('forgot-modal').classList.remove('open');
  };

  window.sendPasswordReset = async () => {
    const email = document.getElementById('forgot-email').value.trim();
    
    if (!email) {
      return showMsg('forgot-msg', 'Please enter your email address.', 'error');
    }

    try {
      await sendPasswordResetEmail(auth, email);
      showMsg('forgot-msg', '✅ Password reset link sent! Check your email.', 'success');
      
      setTimeout(() => {
        closeForgotPassword();
      }, 3000);
    } catch (error) {
      console.error('Password reset error:', error);
      
      if (error.code === 'auth/user-not-found') {
        showMsg('forgot-msg', 'No account found with this email.', 'error');
      } else if (error.code === 'auth/invalid-email') {
        showMsg('forgot-msg', 'Invalid email address.', 'error');
      } else {
        showMsg('forgot-msg', 'Failed to send reset link. Try again.', 'error');
      }
    }
  };
</script>
</body>
</html>
