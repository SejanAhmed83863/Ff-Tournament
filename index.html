<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Jahanabad Tournament Club - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root { --gold: #FFD700; --amber: #b8860b; --dark: #0A0A0F; --card: #12121A; --border: #2A2A3A; --text: #E8E8F0; --muted: #6B6B80; }
    body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 0; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,215,0,0.12) 0%, transparent 70%); pointer-events: none; z-index: 0; }

    .container { width: 92%; max-width: 400px; position: relative; z-index: 1; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    
    .logo { text-align: center; margin-bottom: 20px; }
    .logo h1 { font-family: 'Bebas Neue', cursive; font-size: 3rem; letter-spacing: 2px; background: linear-gradient(to bottom, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 8px; }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-radius: 6px; font-weight: 700; font-size: 0.9rem; transition: 0.3s; color: var(--muted); }
    .tab.active { background: var(--gold); color: var(--dark); }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; padding: 12px 15px; color: #fff; font-family: inherit; font-size: 1rem; transition: 0.3s; }
    input:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.08); }

    .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-family: inherit; font-weight: 700; font-size: 1rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), var(--amber)); color: var(--dark); margin-top: 5px; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .divider { display: flex; align-items: center; gap: 15px; margin: 20px 0; color: var(--muted); font-size: 0.75rem; font-weight: 600; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .btn-google { background: #fff; color: #000; font-family: 'Rajdhani', sans-serif; }
    .btn-google img { width: 18px; }

    .msg { padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; text-align: center; font-weight: 600; }
    .msg.error { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
    .msg.success { background: rgba(92,255,138,0.15); color: #5cff8a; border: 1px solid rgba(92,255,138,0.3); }

    /* Extra Info Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="logo">
      <h1>JAHANABAD TC</h1>
    </div>

    <div class="tabs">
      <div id="tab-login" class="tab active" onclick="switchTab('login')">LOGIN</div>
      <div id="tab-register" class="tab" onclick="switchTab('register')">SIGN UP</div>
    </div>

    <div id="auth-msg" class="msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="l-email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="l-pass" placeholder="••••••••" required>
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary">Login to Account</button>
    </form>

    <form id="reg-form" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="r-name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>WhatsApp Number</label>
        <input type="tel" id="r-whatsapp" placeholder="017XXXXXXXX" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="r-email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label>Password (min 6 chars)</label>
        <input type="password" id="r-pass" placeholder="••••••••" required>
      </div>
      <button type="submit" id="reg-btn" class="btn btn-primary">Create Account</button>
    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <button type="button" class="btn btn-google" onclick="loginGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/layout/google.png" alt="G">
      Google Account
    </button>
  </div>
</div>

<div id="extra-modal" class="modal">
  <div class="card" style="width:100%; max-width:350px;">
    <h2 style="font-family:'Bebas Neue'; letter-spacing:1px; margin-bottom:15px; color:var(--gold); text-align:center;">Complete Profile</h2>
    <div id="g-msg" class="msg"></div>
    <div class="form-group">
      <label>WhatsApp Number</label>
      <input type="tel" id="g-whatsapp" placeholder="01XXXXXXXXX">
    </div>
    <button class="btn btn-primary" onclick="saveGoogleExtra()">Finish Setup</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // --- YOUR FIREBASE CONFIGURATION (Verified from your files) ---
  const firebaseConfig = {
    apiKey: "AIzaSyDE_J0IAn8uE5o3e6uWqXl9e8P3rG9E8P3", // Replace this with your actual API Key from Firebase Console
    authDomain: "tournament-app-4a050.firebaseapp.com",
    projectId: "tournament-app-4a050",
    storageBucket: "tournament-app-4a050.appspot.com",
    messagingSenderId: "374249053880",
    appId: "1:374249053880:web:488667c4df7a387556f8f5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let pendingRegInfo = null;
  let pendingGoogleUser = null;

  // --- UI LOGIC ---
  window.switchTab = (t) => {
    const loginForm = document.getElementById('login-form');
    const regForm = document.getElementById('reg-form');
    const tabL = document.getElementById('tab-login');
    const tabR = document.getElementById('tab-register');
    
    if(t === 'login') {
      loginForm.style.display = 'block';
      regForm.style.display = 'none';
      tabL.classList.add('active');
      tabR.classList.remove('active');
    } else {
      loginForm.style.display = 'none';
      regForm.style.display = 'block';
      tabL.classList.remove('active');
      tabR.classList.add('active');
    }
  };

  function showMsg(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'msg ' + type;
    el.style.display = 'block';
    if(type === 'success') setTimeout(() => el.style.display='none', 4000);
  }

  // --- AUTH LOGIC ---
  
  // 1. Manual Registration
  document.getElementById('reg-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    const name = document.getElementById('r-name').value.trim();
    const whatsapp = document.getElementById('r-whatsapp').value.trim();
    const email = document.getElementById('r-email').value.trim();
    const pass = document.getElementById('r-pass').value;

    if(whatsapp.length < 11) return showMsg('auth-msg', 'Enter valid 11-digit WhatsApp.', 'error');
    
    btn.disabled = true;
    btn.textContent = 'Creating...';

    try {
      pendingRegInfo = { name, whatsapp };
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
    } catch(err) {
      btn.disabled = false;
      btn.textContent = 'Create Account';
      let m = "Registration Failed.";
      if(err.code === 'auth/email-already-in-use') m = "Email already in use!";
      showMsg('auth-msg', m, 'error');
    }
  };

  // 2. Manual Login
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const email = document.getElementById('l-email').value.trim();
    const pass = document.getElementById('l-pass').value;

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(err) {
      btn.disabled = false;
      btn.textContent = 'Login to Account';
      showMsg('auth-msg', 'Invalid Email or Password.', 'error');
    }
  };

  // 3. Google Login
  window.loginGoogle = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch(err) {
      console.error(err);
      showMsg('auth-msg', 'Google Login Failed. Check Authorized Domains.', 'error');
    }
  };

  window.saveGoogleExtra = async () => {
    const whatsapp = document.getElementById('g-whatsapp').value.trim();
    if(whatsapp.length < 11) return showMsg('g-msg', 'Valid WhatsApp required.', 'error');

    const ref = doc(db, 'users', pendingGoogleUser.uid);
    const initialGameUID = Math.floor(1000000000 + Math.random() * 9000000000);

    await setDoc(ref, {
      name: pendingGoogleUser.displayName || 'Player',
      whatsapp: whatsapp,
      email: pendingGoogleUser.email,
      game_name: '',
      uid_game: initialGameUID,
      balance: 0, played: 0, wins: 0, total_earned: 0,
      uid_changed: false,
      created_at: serverTimestamp()
    });
    window.location.href = 'home.html';
  };

  // --- OBSERVER ---
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        if (pendingRegInfo) {
          // Manual signup completion
          const initialGameUID = Math.floor(1000000000 + Math.random() * 9000000000);
          await setDoc(ref, {
            name: pendingRegInfo.name,
            whatsapp: pendingRegInfo.whatsapp,
            email: user.email,
            game_name: '',
            uid_game: initialGameUID,
            balance: 0, played: 0, wins: 0, total_earned: 0,
            uid_changed: false,
            created_at: serverTimestamp()
          });
          window.location.href = 'home.html';
        } else {
          // Google signup needs WhatsApp
          pendingGoogleUser = user;
          document.getElementById('extra-modal').classList.add('open');
        }
      } else {
        window.location.href = 'home.html';
      }
    }
  });
</script>
</body>
</html>
